[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tally-connect"
version = "0.2.0"
description = "Neural Desk Tally Connect: post sales, purchase, credit note, debit note, receipt and payment entries into TallyPrime from Claude, with preview, confirm and balance verification."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1", "mcp>=1.2"]
license = { file = "LICENSE.md" }

[project.scripts]
tally-connect = "tally_connect.cli:main"
tally-connect-mcp = "tally_connect.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tally_connect = ["ui/*.html"]
